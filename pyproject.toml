[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceos"
version = "1.0.0"
description = "VoiceOS - offline Windows voice assistant (Jarvis)"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["src"]
